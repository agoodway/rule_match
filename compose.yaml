services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rule_match
      POSTGRES_PASSWORD: rule_match
      POSTGRES_DB: rule_match_dev
    ports:
      - "127.0.0.1:${RULE_MATCH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rule_match -d rule_match_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
